# Role-split deployment for one BTC board:
#   - indexer — the sole projection-DB writer + the API the frontend reads
#   - oracle  — the SOLE writer of the BTC feed's oracle cell (own wallet)
#   - keeper  — drives the lifecycle for ALL configured BTC durations (5m/15m/1h/1d)
#               in one process, so coincident-boundary transitions batch onto the
#               single per-feed oracle cell. Own wallet + private tx_log DB.
#
#   docker compose --env-file .env up --build
# Build context is the repo root so the file:../game-sdk dependency resolves.
#
# One keeper per FEED (not per cadence): all BTC durations read the same BTC oracle
# cell, and a single process can fold their coincident resolve/activate transitions
# into one transaction (pool_type allows one oracle dep per feed per tx). Splitting a
# feed into per-cadence keepers would lose that batching and multiply wallets/DBs/RPC;
# do it only later if load or failure-isolation demands it. Each keeper still owns only
# its configured (feedId, durationSecs) lane set, so it never drives a retired duration.
#
# Pointing at a host offckb devnet: set
# WATCHER_CKB_RPC_URL=http://host.docker.internal:8114 in .env.

x-watcher: &watcher
  build:
    context: ../..
    dockerfile: packages/watcher/Dockerfile
  env_file: .env
  volumes:
    - watcher-data:/app/packages/watcher/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped

services:
  # The single projection-DB writer + the frontend API. Indexes every lane. If the
  # oracle/keeper use different wallets than this process, set
  # WATCHER_OPERATOR_LOCK_HASHES in .env to the keeper's creator-lock hash so the
  # indexer projects the keeper's pools.
  indexer:
    <<: *watcher
    environment:
      WATCHER_ROLE: indexer
      WATCHER_DB_PATH: /app/packages/watcher/data/index.db
    ports:
      - "${WATCHER_API_PORT:-8080}:8080"

  # The SOLE writer of the BTC feed's oracle cell. Advances the cell at the grid
  # boundaries + boundaries+grace every configured duration needs (see OracleWorker).
  # Needs its OWN funded wallet (WATCHER_KEY_ORACLE) and the live oracle wiring
  # (WATCHER_ORACLE=live + WATCHER_ORACLE_CONFIG pointing at the Lean Oracle network).
  oracle:
    <<: *watcher
    environment:
      WATCHER_ROLE: oracle
      WATCHER_ORACLE: live
      WATCHER_DB_PATH: /app/packages/watcher/data/oracle.db
      WATCHER_CREATOR_PRIVATE_KEY: ${WATCHER_KEY_ORACLE:-${WATCHER_CREATOR_PRIVATE_KEY}}

  # One keeper for the whole BTC feed: WATCHER_LANES empty = all configured BTC
  # durations. Reads (never advances) the oracle cell, so it also needs WATCHER_ORACLE=live
  # to get a real read-only source. Own funded wallet + private tx_log DB.
  keeper-btc:
    <<: *watcher
    environment:
      WATCHER_ROLE: keeper
      WATCHER_ORACLE: live
      WATCHER_LANES: ""
      WATCHER_DB_PATH: /app/packages/watcher/data/keeper-btc.db
      WATCHER_CREATOR_PRIVATE_KEY: ${WATCHER_KEY_BTC:-${WATCHER_CREATOR_PRIVATE_KEY}}

volumes:
  watcher-data:
